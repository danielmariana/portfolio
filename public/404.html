<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>portfolio</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages serves this file for any URL that doesn't match a real
      // file (e.g. a direct visit or refresh on /portfolio/side-b). It encodes
      // the path the visitor actually wanted into a query string and sends
      // them to index.html, which decodes it and restores the real URL before
      // React Router ever sees it.
      var pathSegmentsToKeep = 1 // "/portfolio" — matches vite.config.ts's `base`

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
